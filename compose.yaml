name: pregunta-del-dia

x-node: &node
  build:
    context: .
    target: dev
  image: pregunta-del-dia-dev
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  dev:
    <<: *node
    ports:
      - "5173:5173"

  builder:
    <<: *node
    profiles: [tools]
    command: sh -c "npm install && npm run build"

  preview:
    <<: *node
    profiles: [tools]
    ports:
      - "4173:4173"
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0"

volumes:
  node_modules:
