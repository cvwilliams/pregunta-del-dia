name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # This job name (and "lighthouse" below) are required status checks in .github/rulesets/protect-main.json.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # same as the Dockerfile
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and content tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Save build for the Lighthouse job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  lighthouse:
    # Audits the production build; score thresholds are in lighthouserc.json.
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Runs Lighthouse 3 times against dist/ (mobile, throttled) and fails if a
      # median category score drops below its threshold. Uses the runner's Chrome.
      - name: Run Lighthouse
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 14
